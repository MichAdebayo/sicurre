# Default HTTPS server for the shared nginx-proxy.
#
# A TLS connection whose server name matches no vhost, such as a scan of the
# server's IP, is refused during the handshake, so it never reaches an
# application or its logs. Named vhosts are unaffected: Cloudflare always
# connects to the origin with the proxied host name.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
