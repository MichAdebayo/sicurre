map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream sicurre_app {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sicurre.com www.sicurre.com;

    ssl_certificate /etc/nginx/ssl/sicurre-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/sicurre-origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy, deliberately in Report-Only first.
    #
    # A too-strict policy breaks the application silently — fonts stop loading,
    # a widget dies, the page renders half-built with nothing in the server
    # logs. Report-Only sends violations to the browser console and blocks
    # nothing, so the policy can be verified against real traffic before it is
    # enforced. Switch the header name to Content-Security-Policy once the
    # console is clean.
    #
    # Sources, all of them load-bearing:
    #   challenges.cloudflare.com  Turnstile, on the sign-in and sign-up forms.
    #                              It needs both script-src and frame-src; omit
    #                              either and authentication breaks.
    #   fonts.googleapis.com       the stylesheet linked from index.html
    #   fonts.gstatic.com          the font files that stylesheet pulls
    #
    # style-src keeps 'unsafe-inline' because React sets style attributes and
    # the build inlines critical CSS. Removing it needs a nonce or hash pass
    # over the build, which is not a change to make before a defence.
    # HSTS is set at the Cloudflare edge, not here.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Documentation is served only by local development services.
    location ~ ^/(docs|redoc|openapi\.json|api/auth/reference|api/auth/open-api/generate-schema)(/|$) {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location / {
        proxy_pass http://sicurre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
    }
}
