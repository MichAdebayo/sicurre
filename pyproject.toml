[project]
name = "sicurre"
version = "0.1.0"
description = "Documentation and architecture workspace for Sicurre"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "boto3>=1.42.76",
    "cachetools>=7.0.3",
    "deep-translator>=1.11.4",
    "dnspython>=2.8.0",
    "fastapi>=0.135.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "huggingface-hub>=1.10.1",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.9",
    "psycopg-binary>=3.3.3",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.7.4",
    "pypdf2>=3.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "slowapi>=0.1.9",
    "streamlit>=1.57.0",
    "uvicorn>=0.41.0",
    "virtualenv>=21.1.0",
    "warcio>=1.7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
backend = [
    "aiosqlite>=0.21.0",
    "alembic>=1.14.1",
    "beautifulsoup4>=4.14.3",
    "boto3>=1.40.45",
    "cachetools>=5.5.2",
    "feedparser>=6.0.12",
    "fastapi>=0.115.12",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.9",
    "psycopg[binary]>=3.2.6",
    "pydantic-settings>=2.8.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.47",
    "uvicorn>=0.34.0",
]
dev = [
    "beautifulsoup4>=4.14.3",
    "datasets>=4.6.1",
    "db-dtypes>=1.5.0",
    "faker>=40.5.1",
    "google-cloud-bigquery>=3.40.1",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "kaggle>=2.0.0",
    "langdetect>=1.0.9",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.47",
    "warcio>=1.7.5",
]
storage = [
    "google-cloud-storage>=3.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
