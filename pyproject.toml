[project]
name = "sicurre"
version = "0.1.0"
description = "Documentation and architecture workspace for Sicurre"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "boto3>=1.42.76",
    "cachetools>=7.0.3",
    "deep-translator>=1.11.4",
    "dnspython>=2.8.0",
    "fastapi>=0.135.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "huggingface-hub>=1.10.1",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.9",
    "psycopg-binary>=3.3.3",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.7.4",
    "pypdf2>=3.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "requests>=2.32.5",
    "respx>=0.23.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "slowapi>=0.1.9",
    "streamlit>=1.57.0",
    "uvicorn>=0.41.0",
    "virtualenv>=21.1.0",
    "warcio>=1.7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
runtime = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.76",
    "cachetools>=7.0.3",
    "click>=8.3.3",
    "cryptography>=48.0.1",
    "dnspython>=2.8.0",
    "fastapi>=0.135.1",
    "feedparser>=6.0.12",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "mako>=1.3.12",
    "opentelemetry-exporter-otlp-proto-http>=1.37.0",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-sdk>=1.37.0",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.9",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.3",
    "pyarrow>=23.0.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "slowapi>=0.1.9",
    "soupsieve>=2.8.4",
    "sqlalchemy>=2.0.47",
    "uvicorn>=0.41.0",
    "urllib3>=2.7.0",
    "warcio>=1.7.5",
]
release = [
    "kaggle>=2.2.3",
]
backend = [
    "aiosqlite>=0.21.0",
    "alembic>=1.14.1",
    "beautifulsoup4>=4.14.3",
    "boto3>=1.40.45",
    "cachetools>=5.5.2",
    "feedparser>=6.0.12",
    "fastapi>=0.115.12",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.9",
    "psycopg[binary]>=3.2.6",
    "pydantic-settings>=2.8.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.47",
    "uvicorn>=0.34.0",
]
dev = [
    "beautifulsoup4>=4.14.3",
    "datasets>=4.6.1",
    "db-dtypes>=1.5.0",
    "diff-cover>=9.7.1",
    "faker>=40.5.1",
    "google-cloud-bigquery>=3.40.1",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "interrogate>=1.7.0",
    "jupyter>=1.1.1",
    "kaggle>=2.2.2",
    "langdetect>=1.0.9",
    "matplotlib>=3.10.8",
    "mypy>=1.17.0",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.9",
    "pip-audit>=2.9.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "ruff>=0.12.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.47",
    "warcio>=1.7.5",
]
storage = [
    "google-cloud-storage>=3.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "e2e: live or containerized end-to-end checks that require explicit execution",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
