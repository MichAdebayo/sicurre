    get:
      description: 'Return all known PhishTank phishing URLs for classifier pipeline use.


        Intended for service-to-service calls only (e.g. from sicurre-ml).

        Pass ``since`` for incremental updates after the initial seed load.'
      operationId: get_phishtank_snapshot_internal_phishtank_snapshot_get
      parameters:
      - description: ISO 8601 timestamp — only return URLs extracted after this time
        in: query
        name: since
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: ISO 8601 timestamp — only return URLs extracted after this time
