components:
  schemas:
    AdminDomainPageResponse:
      additionalProperties: false
      description: Searchable page of connected customer domains.
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminDomainResponse'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        pages:
          minimum: 1.0
          title: Pages
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      - pages
      title: AdminDomainPageResponse
      type: object
    AdminDomainResponse:
      additionalProperties: false
      description: Bounded Cloudflare domain inventory row.
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        user_email:
          anyOf:
          - type: string
          - type: 'null'
          title: User Email
        zone_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Zone Name
      title: AdminDomainResponse
      type: object
    AdminFeedbackResponse:
      additionalProperties: false
      description: Recent feedback audit row.
      properties:
        corrected_verdict:
          title: Corrected Verdict
          type: string
        created_at:
          title: Created At
          type: string
        feedback_type:
          title: Feedback Type
          type: string
        id:
          title: Id
          type: string
        original_verdict:
          anyOf:
          - type: string
          - type: 'null'
          title: Original Verdict
        reporter_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Reporter Email
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - feedback_type
      - corrected_verdict
      - created_at
      title: AdminFeedbackResponse
      type: object
    AdminOverviewResponse:
      additionalProperties: false
      description: Bounded operational overview for platform administrators.
      properties:
        cloudflare_domains:
          items:
            $ref: '#/components/schemas/AdminDomainResponse'
          title: Cloudflare Domains
          type: array
        feedback_by_type:
          items:
            $ref: '#/components/schemas/FeedbackCountResponse'
          title: Feedback By Type
          type: array
        recent_feedback:
          items:
            $ref: '#/components/schemas/AdminFeedbackResponse'
          title: Recent Feedback
          type: array
        recent_quarantine:
          items:
            $ref: '#/components/schemas/AdminQuarantineResponse'
          title: Recent Quarantine
          type: array
        recent_support:
          items:
            $ref: '#/components/schemas/AdminSupportResponse'
          title: Recent Support
          type: array
        summary:
          $ref: '#/components/schemas/AdminSummaryResponse'
        verdicts:
          items:
            $ref: '#/components/schemas/VerdictCountResponse'
          title: Verdicts
          type: array
      required:
      - summary
      - verdicts
      - feedback_by_type
      - cloudflare_domains
      - recent_feedback
      - recent_quarantine
      - recent_support
      title: AdminOverviewResponse
      type: object
    AdminQuarantineResponse:
      additionalProperties: false
      description: Recent quarantine audit row.
      properties:
        composite_score:
          title: Composite Score
          type: number
        created_at:
          title: Created At
          type: string
        expires_at:
          title: Expires At
          type: string
        id:
          title: Id
          type: string
        safety_verdict:
          title: Safety Verdict
          type: string
        status:
          title: Status
          type: string
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - safety_verdict
      - composite_score
      - status
      - created_at
      - expires_at
      title: AdminQuarantineResponse
      type: object
    AdminRuntimeHealthResponse:
      additionalProperties: false
      description: Aggregated platform health visible to administrators.
      properties:
        checked_at:
          title: Checked At
          type: string
        components:
          items:
            $ref: '#/components/schemas/RuntimeComponentResponse'
          title: Components
          type: array
        expected_worker_scan_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Worker Scan Url
        inference_api_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Inference Api Url
        public_api_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Api Host
        status:
          enum:
          - ok
          - degraded
          - down
          - unknown
          title: Status
          type: string
      required:
      - status
      - checked_at
      - components
      title: AdminRuntimeHealthResponse
      type: object
    AdminSummaryResponse:
      additionalProperties: false
      description: Platform-wide bounded counters.
      properties:
        cloudflare_active_count:
          minimum: 0.0
          title: Cloudflare Active Count
          type: integer
        cloudflare_integrations_count:
          minimum: 0.0
          title: Cloudflare Integrations Count
          type: integer
        false_negative_count:
          minimum: 0.0
          title: False Negative Count
          type: integer
        feedback_count:
          minimum: 0.0
          title: Feedback Count
          type: integer
        members_count:
          minimum: 0.0
          title: Members Count
          type: integer
        quarantine_held_count:
          minimum: 0.0
          title: Quarantine Held Count
          type: integer
        reported_email_count:
          minimum: 0.0
          title: Reported Email Count
          type: integer
        support_open_count:
          minimum: 0.0
          title: Support Open Count
          type: integer
        threat_events_count:
          minimum: 0.0
          title: Threat Events Count
          type: integer
        workspaces_count:
          minimum: 0.0
          title: Workspaces Count
          type: integer
      required:
      - workspaces_count
      - members_count
      - threat_events_count
      - feedback_count
      - false_negative_count
      - reported_email_count
      - quarantine_held_count
      - cloudflare_integrations_count
      - cloudflare_active_count
      - support_open_count
      title: AdminSummaryResponse
      type: object
    AdminSupportResponse:
      additionalProperties: false
      description: Recent support request audit row.
      properties:
        category:
          title: Category
          type: string
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        requester_email:
          title: Requester Email
          type: string
        status:
          title: Status
          type: string
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - requester_email
      - category
      - status
      - created_at
      title: AdminSupportResponse
      type: object
    AlertHistoryResponse:
      additionalProperties: false
      description: One customer-visible notification.
      properties:
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        message:
          title: Message
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - message
      - created_at
      title: AlertHistoryResponse
      type: object
    AlertPreferenceResponse:
      additionalProperties: false
      description: Workspace notification preferences.
      properties:
        notify_phishing:
          title: Notify Phishing
          type: boolean
        notify_spam:
          title: Notify Spam
          type: boolean
        quiet_hours_enabled:
          title: Quiet Hours Enabled
          type: boolean
        quiet_hours_end:
          title: Quiet Hours End
          type: string
        quiet_hours_start:
          title: Quiet Hours Start
          type: string
        timezone:
          title: Timezone
          type: string
      required:
      - notify_phishing
      - notify_spam
      - quiet_hours_enabled
      - quiet_hours_start
      - quiet_hours_end
      - timezone
      title: AlertPreferenceResponse
      type: object
    AlertPreferenceUpdate:
      properties:
        notify_phishing:
          title: Notify Phishing
          type: boolean
        notify_spam:
          title: Notify Spam
          type: boolean
        quiet_hours_enabled:
          title: Quiet Hours Enabled
          type: boolean
        quiet_hours_end:
          default: 07:00
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
          title: Quiet Hours End
          type: string
        quiet_hours_start:
          default: '22:00'
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
          title: Quiet Hours Start
          type: string
        timezone:
          default: Europe/Paris
          maxLength: 64
          minLength: 1
          title: Timezone
          type: string
      required:
      - notify_phishing
      - notify_spam
      - quiet_hours_enabled
      title: AlertPreferenceUpdate
      type: object
    AnnotationCreate:
      properties:
        annotated_at:
          format: date-time
          title: Annotated At
          type: string
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        is_validated:
          default: false
          title: Is Validated
          type: boolean
        label:
          $ref: '#/components/schemas/AnnotationLabel'
        label_source:
          $ref: '#/components/schemas/AnnotationLabelSource'
        normalized_message_id:
          format: uuid
          title: Normalized Message Id
          type: string
      required:
      - normalized_message_id
      - label
      - label_source
      - annotated_at
      title: AnnotationCreate
      type: object
    AnnotationLabel:
      enum:
      - phishing
      - spam
      - legitimate
      - unknown
      title: AnnotationLabel
      type: string
    AnnotationLabelSource:
      enum:
      - common_crawl_acceptance_review
      - generation_gated_promotion
      - manual_review
      - normalized_message_backfill
      title: AnnotationLabelSource
      type: string
    AnnotationRead:
      properties:
        annotated_at:
          format: date-time
          title: Annotated At
          type: string
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        is_validated:
          default: false
          title: Is Validated
          type: boolean
        label:
          $ref: '#/components/schemas/AnnotationLabel'
        label_source:
          $ref: '#/components/schemas/AnnotationLabelSource'
        normalized_message_id:
          format: uuid
          title: Normalized Message Id
          type: string
      required:
      - normalized_message_id
      - label
      - label_source
      - annotated_at
      - id
      - created_at
      title: AnnotationRead
      type: object
    AuthSessionResponse:
      additionalProperties: false
      description: Authenticated workspace and onboarding state.
      properties:
        display_name:
          title: Display Name
          type: string
        email:
          title: Email
          type: string
        has_cloudflare_integration:
          title: Has Cloudflare Integration
          type: boolean
        id:
          title: Id
          type: string
        is_platform_admin:
          title: Is Platform Admin
          type: boolean
        onboarding_required:
          title: Onboarding Required
          type: boolean
        role:
          title: Role
          type: string
        sla_latency_ms:
          minimum: 0.0
          title: Sla Latency Ms
          type: integer
        threat_count:
          minimum: 0.0
          title: Threat Count
          type: integer
        workspace_id:
          title: Workspace Id
          type: string
        workspace_name:
          title: Workspace Name
          type: string
      required:
      - id
      - email
      - display_name
      - role
      - workspace_id
      - workspace_name
      - is_platform_admin
      - has_cloudflare_integration
      - threat_count
      - onboarding_required
      - sla_latency_ms
      title: AuthSessionResponse
      type: object
    BlacklistStatusResponse:
      additionalProperties: false
      description: Consolidated reputation-provider result.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        listed:
          title: Listed
          type: boolean
        matched:
          items:
            type: string
          title: Matched
          type: array
      required:
      - listed
      - matched
      title: BlacklistStatusResponse
      type: object
    CloudflareDnsSyncResponse:
      additionalProperties: false
      description: Domain Shield values recomputed during provisioning.
      properties:
        dmarc_record:
          anyOf:
          - type: string
          - type: 'null'
          title: Dmarc Record
        dmarc_reporting_enabled:
          title: Dmarc Reporting Enabled
          type: boolean
        reputation_score:
          maximum: 100.0
          minimum: 0.0
          title: Reputation Score
          type: integer
        score_grade:
          title: Score Grade
          type: string
        updated_at:
          title: Updated At
          type: string
        zone_id:
          title: Zone Id
          type: string
      required:
      - zone_id
      - dmarc_reporting_enabled
      - reputation_score
      - score_grade
      - updated_at
      title: CloudflareDnsSyncResponse
      type: object
    CloudflareIntegrationResponse:
      additionalProperties: false
      description: Sanitized Cloudflare integration state; credentials are never returned.
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        destination_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Email
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        status:
          title: Status
          type: string
        token_configured:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Token Configured
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        user_email:
          anyOf:
          - type: string
          - type: 'null'
          title: User Email
        worker_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Name
        zone_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Zone Name
      required:
      - status
      title: CloudflareIntegrationResponse
      type: object
    CloudflareSetupRequest:
      properties:
        cf_api_token:
          anyOf:
          - type: string
          - type: 'null'
          description: Cloudflare API token with DNS + Workers + Email Routing write access
          title: Cf Api Token
        destination_email:
          description: Where clean mail is forwarded after scanning
          title: Destination Email
          type: string
        fix_dkim:
          default: true
          title: Fix Dkim
          type: boolean
        fix_dmarc:
          default: true
          title: Fix Dmarc
          type: boolean
        fix_spf:
          default: true
          title: Fix Spf
          type: boolean
        zone_name:
          description: Domain to protect, e.g. vinse.app
          title: Zone Name
          type: string
      required:
      - zone_name
      - destination_email
      title: CloudflareSetupRequest
      type: object
    CloudflareSetupResponse:
      additionalProperties: false
      description: Cloudflare provisioning or reprovisioning acknowledgement.
      properties:
        destination_email:
          title: Destination Email
          type: string
        dns_sync:
          anyOf:
          - $ref: '#/components/schemas/CloudflareDnsSyncResponse'
          - type: 'null'
        integration_id:
          title: Integration Id
          type: string
        message:
          title: Message
          type: string
        status:
          title: Status
          type: string
        worker_update:
          anyOf:
          - $ref: '#/components/schemas/CloudflareWorkerUpdateResponse'
          - type: 'null'
        zone_name:
          title: Zone Name
          type: string
      required:
      - integration_id
      - status
      - zone_name
      - destination_email
      - message
      title: CloudflareSetupResponse
      type: object
    CloudflareTeardownResponse:
      additionalProperties: false
      description: Removed Cloudflare integration.
      properties:
        status:
          const: removed
          title: Status
          type: string
        zone_name:
          title: Zone Name
          type: string
      required:
      - status
      - zone_name
      title: CloudflareTeardownResponse
      type: object
    CloudflareTokenSaveRequest:
      properties:
        cf_api_token:
          description: Cloudflare API token to store
          title: Cf Api Token
          type: string
      required:
      - cf_api_token
      title: CloudflareTokenSaveRequest
      type: object
    CloudflareTokenStatusResponse:
      additionalProperties: false
      description: Presence of an encrypted workspace Cloudflare credential.
      properties:
        configured:
          title: Configured
          type: boolean
      required:
      - configured
      title: CloudflareTokenStatusResponse
      type: object
    CloudflareTokenVerificationResponse:
      additionalProperties: false
      description: Cloudflare token and zone-access validation result.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        valid:
          title: Valid
          type: boolean
        zone_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Zone Id
      required:
      - valid
      title: CloudflareTokenVerificationResponse
      type: object
    CloudflareWorkerUpdateResponse:
      additionalProperties: false
      description: Worker binding update performed during reprovisioning.
      properties:
        scan_url:
          title: Scan Url
          type: string
        updated:
          title: Updated
          type: boolean
        worker_name:
          title: Worker Name
          type: string
      required:
      - updated
      - scan_url
      - worker_name
      title: CloudflareWorkerUpdateResponse
      type: object
    DataSourceCreate:
      properties:
        contains_personal_data:
          default: false
          title: Contains Personal Data
          type: boolean
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        legal_basis:
          anyOf:
          - type: string
          - type: 'null'
          title: Legal Basis
        name:
          minLength: 1
          title: Name
          type: string
        owner_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Name
        retention_days:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Retention Days
        source_type:
          $ref: '#/components/schemas/SourceType'
      required:
      - name
      - source_type
      title: DataSourceCreate
      type: object
    DataSourceListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DataSourceRead'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: DataSourceListResponse
      type: object
    DataSourceRead:
      properties:
        contains_personal_data:
          default: false
          title: Contains Personal Data
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        legal_basis:
          anyOf:
          - type: string
          - type: 'null'
          title: Legal Basis
        name:
          minLength: 1
          title: Name
          type: string
        owner_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Name
        retention_days:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Retention Days
        source_type:
          $ref: '#/components/schemas/SourceType'
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
      required:
      - name
      - source_type
      - id
      - is_active
      - created_at
      title: DataSourceRead
      type: object
    DatasetCreate:
      properties:
        name:
          minLength: 1
          title: Name
          type: string
        status:
          $ref: '#/components/schemas/DatasetStatus'
        target_usage:
          minLength: 1
          title: Target Usage
          type: string
        version_tag:
          minLength: 1
          title: Version Tag
          type: string
      required:
      - name
      - version_tag
      - target_usage
      - status
      title: DatasetCreate
      type: object
    DatasetItemListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DatasetItemRead'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: DatasetItemListResponse
      type: object
    DatasetItemRead:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        dataset_id:
          format: uuid
          title: Dataset Id
          type: string
        id:
          format: uuid
          title: Id
          type: string
        normalized_message_id:
          format: uuid
          title: Normalized Message Id
          type: string
        row_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Row Order
        sample_weight:
          title: Sample Weight
          type: number
        split_name:
          $ref: '#/components/schemas/SplitName'
      required:
      - id
      - dataset_id
      - normalized_message_id
      - split_name
      - sample_weight
      - created_at
      title: DatasetItemRead
      type: object
    DatasetListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DatasetRead'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: DatasetListResponse
      type: object
    DatasetPublishResponse:
      properties:
        github_dispatch_sent:
          title: Github Dispatch Sent
          type: boolean
        kaggle_url:
          title: Kaggle Url
          type: string
        kaggle_version_id:
          title: Kaggle Version Id
          type: integer
      required:
      - kaggle_url
      - kaggle_version_id
      - github_dispatch_sent
      title: DatasetPublishResponse
      type: object
    DatasetRead:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        frozen_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Frozen At
        id:
          format: uuid
          title: Id
          type: string
        item_count:
          title: Item Count
          type: integer
        name:
          minLength: 1
          title: Name
          type: string
        status:
          $ref: '#/components/schemas/DatasetStatus'
        target_usage:
          minLength: 1
          title: Target Usage
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        version_tag:
          minLength: 1
          title: Version Tag
          type: string
      required:
      - name
      - version_tag
      - target_usage
      - status
      - id
      - item_count
      - created_at
      title: DatasetRead
      type: object
    DatasetStatus:
      enum:
      - draft
      - frozen
      - archived
      title: DatasetStatus
      type: string
    DatasetSummaryResponse:
      additionalProperties: false
      description: Published or draft dataset visible to administrators.
      properties:
        id:
          title: Id
          type: string
        item_count:
          minimum: 0.0
          title: Item Count
          type: integer
        published_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Published At
        status:
          title: Status
          type: string
        version_tag:
          title: Version Tag
          type: string
      required:
      - id
      - version_tag
      - item_count
      - status
      title: DatasetSummaryResponse
      type: object
    DmarcImportResponse:
      additionalProperties: false
      description: Idempotent DMARC import result.
      properties:
        record_count:
          minimum: 0.0
          title: Record Count
          type: integer
        status:
          enum:
          - imported
          - already_imported
          title: Status
          type: string
      required:
      - status
      - record_count
      title: DmarcImportResponse
      type: object
    DmarcSourceResponse:
      additionalProperties: false
      description: Aggregate DMARC result grouped by sending source.
      properties:
