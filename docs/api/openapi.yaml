info:
  description: Generated from the deployed FastAPI routes and Pydantic models. Authenticated customer
    operations use Better Auth sessions or bearer tokens; internal and email-gateway routes require their
    documented service credentials.
  summary: Data, application, and integration contracts for Sicurre.
  title: Sicurre Platform API
  version: 1.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: healthcheck_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Healthcheck
      tags:
      - system
  /internal/ml/candidates:
    post:
      description: Register a successful training result as a non-production candidate.
      operationId: persist_model_candidate_internal_ml_candidates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCandidateRegistration'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineageRecordResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Persist Model Candidate
      tags:
      - internal
  /internal/ml/deployments:
    post:
      description: Record a manually approved promotion workflow result.
      operationId: persist_model_deployment_internal_ml_deployments_post
