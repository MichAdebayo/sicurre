openapi: 3.0.3
info:
  title: Sicurre API
  version: 0.1.0
  description: >
    Sicurre API for phishing classification and inbox remediation (post-delivery).
servers:
  - url: https://api.sicurre.example.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /v1/classify:
    post:
      summary: Classify an email (phishing vs legitimate)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyRequest"
      responses:
        "200":
          description: Classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /v1/remediate/gmail/trash:
    post:
      summary: Move a Gmail message to Trash (requires OAuth token stored per user)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashRequest"
      responses:
        "200":
          description: Trash action completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /v1/threat-log:
    get:
      summary: List threat log entries for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: List entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThreatLogEntry"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClassifyRequest:
      type: object
      required: [subject, body, sender]
      properties:
        subject:
          type: string
          example: "URGENT : Mise à jour URSSAF requise"
        body:
          type: string
          example: "Bonjour, veuillez confirmer vos informations sous 24h..."
        sender:
          type: string
          example: "urssaf-support@secure-notice.example"
        received_at:
          type: string
          format: date-time
        message_id:
          type: string
          description: Provider message id (Gmail message id)
        language:
          type: string
          example: "fr"

    ClassifyResponse:
      type: object
      required: [label, confidence, signals, model_version]
      properties:
        label:
          type: string
          enum: [phishing, legitimate]
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.97
        signals:
          type: array
          items:
            type: string
          example: ["French admin impersonation", "Suspicious URL", "DMARC fail"]
        model_version:
          type: string
          example: "sicurre/camembertv2-phishing-fr@v0.1.0"

    TrashRequest:
      type: object
      required: [user_id, message_id]
      properties:
        user_id: { type: string }
        message_id: { type: string }
        reason:
          type: string
          example: "phishing verdict confidence>=0.85"

    TrashResponse:
      type: object
      properties:
        status: { type: string, example: trashed }
        message_id: { type: string }

    ThreatLogEntry:
      type: object
      properties:
        id: { type: string }
        message_id: { type: string }
        received_at: { type: string, format: date-time }
        verdict: { type: string, enum: [phishing, legitimate] }
        confidence: { type: number }
        signals:
          type: array
          items: { type: string }
        action_taken: { type: string, example: "trashed" }
        action_at: { type: string, format: date-time }
