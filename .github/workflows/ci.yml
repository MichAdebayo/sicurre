name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: App audit, build, and auth typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Typecheck Better Auth sidecar
        run: npm run auth:typecheck

  data-platform:
    name: Data-platform quality and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv sync --frozen --group backend --group dev --group storage

      - name: Audit production Python dependency set
        run: |
          uv export --frozen --only-group runtime --no-hashes -o /tmp/runtime-requirements.txt
          uv run --no-sync pip-audit --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-248 --ignore-vuln CVE-2026-48818 \
            --ignore-vuln CVE-2026-48817 -r /tmp/runtime-requirements.txt

      - name: Lint deployment-critical Python
        run: |
          uv run --no-sync ruff check src/core/config.py src/db/runtime.py src/db/models/app_runtime.py src/db/migrations_app src/data_platform/extractors/incremental_cc_extractor.py src/data_platform/cron_schedulers/bigdata/run_incremental_cc.py tests/data_platform/common_crawl/test_incremental_cc_checkpoint.py tests/data_platform/common_crawl/test_cc_runtime_config.py
          uv run --no-sync ruff format --check src/core/config.py src/data_platform/extractors/incremental_cc_extractor.py src/data_platform/cron_schedulers/bigdata/run_incremental_cc.py tests/data_platform/common_crawl/test_incremental_cc_checkpoint.py tests/data_platform/common_crawl/test_cc_runtime_config.py

      - name: Typecheck deployment-critical Python
        run: uv run --no-sync mypy --config-file mypy.ini --follow-imports=skip

      - name: Enforce critical docstring coverage
        run: uv run --no-sync interrogate -f 90 src/core/config.py src/data_platform/extractors/incremental_cc_extractor.py src/data_platform/cron_schedulers/bigdata/run_incremental_cc.py

      - name: Run data-platform tests with coverage
        run: uv run --no-sync pytest tests/data_platform --cov=src --cov-report=term-missing --cov-fail-under=50

  docker-smoke:
    name: Docker app-stack smoke
    runs-on: ubuntu-latest
    needs: [workflow-lint, secret-scan, app, data-platform]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate production compose
        env:
          SICURRE_API_ENV_FILE: ./deploy/env.api.example
          SICURRE_AUTH_ENV_FILE: ./deploy/env.auth.example
          SICURRE_ALLOY_ENV_FILE: ./deploy/env.alloy.example
        run: |
          docker compose --env-file deploy/env.compose.example -f docker-compose.prod.yml config --quiet

      - name: Run app stack smoke
        run: make app-stack-smoke
