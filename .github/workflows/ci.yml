name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [app, develop, main]

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:
  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for committed secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --gitleaks-ignore-path /repo/.gitleaksignore \
              --redact --no-banner --verbose

  app:
    name: App audit, build, and auth typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run app and auth tests with coverage
        run: npm run test:coverage

      - name: Upload JavaScript coverage
        uses: actions/upload-artifact@v6
        with:
          name: javascript-coverage
          path: coverage/javascript
          if-no-files-found: error

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Typecheck Better Auth sidecar
        run: npm run auth:typecheck

  data-platform:
    name: Data-platform quality and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv sync --frozen --group runtime --group backend --group dev --group storage

      - name: Audit production Python dependency set
        run: |
          uv export --frozen --only-group runtime --no-hashes -o /tmp/runtime-requirements.txt
          uv run --no-sync pip-audit --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-248 --ignore-vuln CVE-2026-48818 \
            --ignore-vuln CVE-2026-48817 -r /tmp/runtime-requirements.txt

      - name: Lint deployment-critical Python
        run: |
          uv run --no-sync ruff check src/core/config.py src/db/runtime.py src/db/models/app_runtime.py src/db/migrations_app src/data_platform/extractors/incremental_cc_extractor.py src/data_platform/cron_schedulers/bigdata/run_incremental_cc.py tests/integration/data_platform/common_crawl/test_incremental_cc_checkpoint.py tests/unit/data_platform/common_crawl/test_cc_runtime_config.py
          uv run --no-sync ruff format --check src/core/config.py src/data_platform/extractors/incremental_cc_extractor.py src/data_platform/cron_schedulers/bigdata/run_incremental_cc.py tests/integration/data_platform/common_crawl/test_incremental_cc_checkpoint.py tests/unit/data_platform/common_crawl/test_cc_runtime_config.py

      - name: Typecheck deployment-critical Python
        run: uv run --no-sync mypy --config-file mypy.ini --follow-imports=skip

      - name: Enforce critical docstring coverage
        run: uv run --no-sync interrogate -f 90 src/core/config.py src/data_platform/extractors/incremental_cc_extractor.py src/data_platform/cron_schedulers/bigdata/run_incremental_cc.py

      - name: Run Python tests with repository coverage ratchet
        run: |
          mkdir -p coverage/python
          uv run --no-sync pytest tests/unit tests/integration \
            --cov=src --cov-branch --cov-report=term-missing \
            --cov-report=xml:coverage/python/coverage.xml --cov-fail-under=50

      - name: Enforce 90% core and database coverage
        run: |
          uv run --no-sync pytest tests/unit tests/integration \
            --cov=src/core --cov=src/db --cov-branch \
            --cov-report=term-missing --cov-fail-under=90

      - name: Enforce 90% coverage on changed Python lines
        if: github.event_name == 'pull_request'
        run: |
          uv run --no-sync diff-cover coverage/python/coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} --fail-under=90

      - name: Upload Python coverage
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage
          path: coverage/python
          if-no-files-found: error

  docker-smoke:
    name: Docker app-stack smoke
    runs-on: ubuntu-latest
    needs: [workflow-lint, secret-scan, app, data-platform]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Validate production compose
        env:
          SICURRE_API_ENV_FILE: ./deploy/env.api.example
          SICURRE_AUTH_ENV_FILE: ./deploy/env.auth.example
          SICURRE_ALLOY_ENV_FILE: ./deploy/env.alloy.example
        run: |
          docker compose --env-file deploy/env.compose.example -f docker-compose.prod.yml config --quiet

      - name: Run app stack smoke
        run: make app-stack-smoke

      - name: Build monthly dataset release image
        run: docker build --target release -f Dockerfile.data-platform .
