name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  app:
    name: App build and auth sidecar typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Typecheck Better Auth sidecar
        run: npm run auth:typecheck

  data-platform:
    name: Data-platform tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv sync --frozen --group backend --group dev --group storage

      - name: Run data-platform tests
        run: uv run pytest tests/data_platform

  docker-smoke:
    name: Docker app-stack smoke
    runs-on: ubuntu-latest
    needs: [app, data-platform]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate production compose
        env:
          SICURRE_API_ENV_FILE: ./deploy/env.api.example
          SICURRE_AUTH_ENV_FILE: ./deploy/env.auth.example
          SICURRE_ALLOY_ENV_FILE: ./deploy/env.alloy.example
        run: |
          docker compose --env-file deploy/env.compose.example -f docker-compose.prod.yml config --quiet

      - name: Run app stack smoke
        run: make app-stack-smoke
