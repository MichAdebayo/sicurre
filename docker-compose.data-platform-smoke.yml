name: sicurre-data-platform-staging-smoke

services:
  data-platform-api:
    build:
      context: .
      dockerfile: Dockerfile.data-platform
    environment:
      SICURRE_ENVIRONMENT: staging-smoke
      SICURRE_AUTH_ENABLED: "false"
      SICURRE_SCHEDULER_ENABLED: "false"
      SICURRE_DATABASE_URL: sqlite+aiosqlite:////app/data/local/staging-smoke.db
      SICURRE_DATA_PLATFORM_DATABASE_URL: sqlite+aiosqlite:////app/data/local/staging-smoke.db
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn data_platform.api.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  data-platform-smoke:
    build:
      context: .
      dockerfile: Dockerfile.data-platform
    depends_on:
      data-platform-api:
        condition: service_healthy
    environment:
      SICURRE_STAGING_API_URL: http://data-platform-api:8001
      SICURRE_STAGING_SMOKE_TOKEN: dev-token
    command:
      - uv
      - run
      - python
      - scripts/data_platform/staging_smoke.py
