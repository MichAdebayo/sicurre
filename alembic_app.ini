[alembic]
# App migrations — targets SICURRE_APP_NEON_DATABASE_URL (Neon)
# This environment manages production app tables: users, sessions, oauth_tokens,
# threat_log, feedback, model_versions.
script_location = %(here)s/src/app/migrations
prepend_sys_path = %(here)s/src
# URL is overridden at runtime by env.py via settings.app_neon_database_url
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
