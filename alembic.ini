[alembic]
# Data platform migrations — targets SICURRE_DATA_PLATFORM_DATABASE_URL (Neon)
# Dev fallback: SICURRE_DATA_PLATFORM_DATABASE_URL defaults to SQLite when unset
script_location = %(here)s/src/db/migrations
prepend_sys_path = %(here)s/src
# URL is overridden at runtime by env.py via settings.sync_data_platform_database_url
sqlalchemy.url = sqlite:///./data/local/sicurre.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s