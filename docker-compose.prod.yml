name: sicurre-prod

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  sicurre-api:
    image: ghcr.io/${GHCR_OWNER:-michaeladebayo99}/sicurre-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${SICURRE_API_ENV_FILE:-./deploy/env.api}
    environment:
      SICURRE_ENVIRONMENT: production
      SICURRE_AUTH_ENABLED: "true"
      SICURRE_BETTER_AUTH_BASE_URL: http://auth-service:3005
      SICURRE_BETTER_AUTH_TIMEOUT_SECONDS: "12"
      SICURRE_INFERENCE_API_URL: http://inference.sicurre.internal:8000/v1/classify
      SICURRE_INTERNAL_APP_PROBE_URL: http://sicurre-app:5173
      SICURRE_TELEMETRY_TRACES_ENABLED: "true"
      SICURRE_TELEMETRY_OTLP_ENDPOINT: http://alloy:4318/v1/traces
      SICURRE_TELEMETRY_TRACE_SAMPLE_RATIO: ${SICURRE_TELEMETRY_TRACE_SAMPLE_RATIO:-1.0}
    expose:
      - "8001"
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && uv run --no-sync alembic -c alembic.app.ini upgrade head && uv run --no-sync uvicorn data_platform.api.main:app --host 0.0.0.0 --port 8001 --no-access-log
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sicurre-internal
      - sicurre-service-mesh
    <<: *default-logging

  sicurre-data-release:
    profiles: ["release"]
    image: ghcr.io/${GHCR_OWNER:-michaeladebayo99}/sicurre-data-release:${IMAGE_TAG:-latest}
    env_file:
      - ${SICURRE_API_ENV_FILE:-./deploy/env.api}
    environment:
      SICURRE_ENVIRONMENT: production
    command: ["make", "monthly-release"]
    networks:
      - sicurre-internal
    <<: *default-logging

  auth-service:
    image: ghcr.io/${GHCR_OWNER:-michaeladebayo99}/sicurre-auth:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${SICURRE_AUTH_ENV_FILE:-./deploy/env.auth}
    environment:
      SICURRE_ENVIRONMENT: production
      SICURRE_BETTER_AUTH_PORT: "3005"
      SICURRE_BETTER_AUTH_URL: ${SICURRE_PUBLIC_APP_URL:-https://sicurre.com}
      BETTER_AUTH_URL: ${SICURRE_PUBLIC_APP_URL:-https://sicurre.com}
      SICURRE_FRONTEND_ORIGIN: ${SICURRE_PUBLIC_APP_URL:-https://sicurre.com}
    expose:
      - "3005"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3005/api/auth/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - sicurre-internal
    <<: *default-logging

  sicurre-app:
    image: ghcr.io/${GHCR_OWNER:-michaeladebayo99}/sicurre-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      sicurre-api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      PORT: "5173"
      API_SERVICE_URL: http://sicurre-api:8001
      AUTH_SERVICE_URL: http://auth-service:3005
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:${SICURRE_APP_HOST_PORT:-8002}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/__app/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - sicurre-internal
    <<: *default-logging

  alloy:
    image: grafana/alloy:v1.16.1@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
    restart: unless-stopped
    env_file:
      - ${SICURRE_ALLOY_ENV_FILE:-./deploy/env.alloy}
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["run", "/etc/alloy/config.alloy"]
    expose:
      - "4317"
      - "4318"
    networks:
      - sicurre-internal
    <<: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - sicurre-internal
    <<: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0@sha256:e75bdb03b74b0b6995f208f166fead2e6e555dde73e44200113bb26f41b1981d
    restart: unless-stopped
    privileged: true
    command:
      # Docker 29's containerd image store has no legacy layerdb metadata.
      - --disable_metrics=disk
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - sicurre-internal
    <<: *default-logging

networks:
  sicurre-internal:
    driver: bridge
  sicurre-service-mesh:
    name: sicurre-service-mesh
    external: true
